<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTUNA — Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a12;
  --bg-2: #14141f;
  --bg-3: #1c1c2a;
  --fg: #f5f5f7;
  --muted: #7a7a90;
  --border: rgba(255,255,255,0.08);
  --accent: #ff2e7e;
  --accent-2: #ff7b00;
  --accent-3: #ffc400;
  --accent-4: #00d9a3;
  --glow: rgba(255, 46, 126, 0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow-x: hidden;
  overflow-y: hidden !important;
  max-width: 100%;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 25%, rgba(255, 46, 126, 0.18), transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(0, 217, 163, 0.12), transparent 50%),
    radial-gradient(circle at 50% 110%, rgba(255, 123, 0, 0.12), transparent 60%);
  z-index: -2;
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 24px 24px;
  z-index: -2;
  pointer-events: none;
  opacity: 0.5;
}

#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  opacity: 0.55;
  pointer-events: none;
}

#confetti-canvas {
  position: fixed;
  inset: 0;
  z-index: 250;
  pointer-events: none;
}

/* Main layout */
main {
  display: grid;
  grid-template-columns: 280px 1fr 280px;
  gap: 2rem;
  padding: 2.5rem 2rem 2rem;
  max-width: 1500px;
  margin: 0 auto;
  align-items: start;
}

@media (max-width: 1100px) {
  main {
    grid-template-columns: 1fr;
    padding: 1.5rem 1rem;
    gap: 1.5rem;
  }
}

/* Side panels */
.side-panel {
  background: linear-gradient(180deg, var(--bg-2), var(--bg-3));
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 1.5rem;
  position: relative;
  overflow: hidden;
  animation: panel-in 0.8s 0.3s both;
}

.side-panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.side-panel::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(255, 46, 126, 0.06), transparent 60%);
  pointer-events: none;
}

@keyframes panel-in {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.panel-title {
  font-size: 0.7rem;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 1.2rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.panel-title::before {
  content: '';
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--accent);
  animation: pulse-dot 1.5s infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(0.7); }
}

/* Numbers grid */
.numbers-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  position: relative;
  z-index: 1;
}

.number-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 1.1rem;
  border-radius: 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  color: var(--muted);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  cursor: default;
}

.number-cell.active {
  background: linear-gradient(135deg, rgba(255, 46, 126, 0.18), rgba(255, 196, 0, 0.12));
  border-color: rgba(255, 46, 126, 0.4);
  color: var(--fg);
  cursor: pointer;
}

.number-cell.active:hover {
  transform: translateY(-3px) scale(1.05);
  border-color: var(--accent);
  box-shadow: 0 8px 20px rgba(255, 46, 126, 0.3);
}

.number-cell.drawn {
  opacity: 0.25;
  text-decoration: line-through;
  background: rgba(255,255,255,0.02);
  border-color: rgba(255,255,255,0.04);
}

.number-cell.just-drawn {
  animation: cell-drawn 0.7s ease;
}

@keyframes cell-drawn {
  0% { background: var(--accent); transform: scale(1.3); color: white; box-shadow: 0 0 30px var(--accent); }
  50% { background: var(--accent-3); transform: scale(1.15); color: var(--bg); }
  100% { background: rgba(255,255,255,0.02); transform: scale(1); opacity: 0.25; }
}

/* History */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 520px;
  overflow-y: auto;
  position: relative;
  z-index: 1;
}

.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-track { background: transparent; }
.history-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 10px;
  animation: slide-in 0.4s ease;
}

@keyframes slide-in {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

.history-number {
  font-family: 'Bebas Neue', sans-serif;
  font-weight: 900;
  font-size: 1.4rem;
  background: linear-gradient(135deg, var(--accent), var(--accent-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 1px;
}

.history-time {
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}

.history-empty {
  text-align: center;
  color: var(--muted);
  font-size: 0.85rem;
  padding: 2rem 0;
  letter-spacing: 1px;
}

/* Wheel section */
.wheel-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  padding: 1rem 0;
}

.title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  letter-spacing: 8px;
  text-align: center;
  line-height: 1;
  background: linear-gradient(135deg, #ffffff 0%, var(--accent) 45%, var(--accent-3) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 20px rgba(255, 46, 126, 0.3));
  animation: title-in 1s ease-out;
}

@keyframes title-in {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.subtitle {
  font-size: 0.8rem;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  animation: fade-up 0.8s 0.3s both;
}

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 0.8rem;
  animation: fade-up 0.8s 0.4s both;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1.1rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 0.7rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: all 0.3s;
}

.stat-pill:hover {
  border-color: var(--accent);
  background: rgba(255, 46, 126, 0.08);
}

.stat-label {
  color: var(--muted);
}

.stat-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  color: var(--accent-3);
  letter-spacing: 1px;
  min-width: 1.5ch;
  text-align: center;
  transition: color 0.3s;
}

.stat-pill.flash .stat-value {
  animation: flash-value 0.6s ease;
}

@keyframes flash-value {
  0% { color: var(--accent-3); transform: scale(1); }
  50% { color: var(--accent); transform: scale(1.3); }
  100% { color: var(--accent-3); transform: scale(1); }
}

@keyframes fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Wheel */
.wheel-container {
  position: relative;
  width: min(500px, 88vw);
  aspect-ratio: 1;
  margin: 1rem 0 0.5rem;
  animation: wheel-in 1.2s 0.4s both cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes wheel-in {
  from { opacity: 0; transform: scale(0.7) rotate(-20deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}

.wheel-glow {
  position: absolute;
  inset: -40px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    var(--accent),
    var(--accent-2),
    var(--accent-3),
    var(--accent-4),
    var(--accent)
  );
  filter: blur(45px);
  opacity: 0.35;
  z-index: -1;
  animation: rotate-glow 8s linear infinite;
  transition: transform 0.3s ease-out, opacity 0.3s;
}

@keyframes rotate-glow {
  to { transform: rotate(360deg); }
}

.wheel-container.spinning .wheel-glow {
  animation: rotate-glow 1.5s linear infinite;
  opacity: 0.7;
}

.wheel-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 3;
  display: block;
}

.wheel {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform-origin: center;
  will-change: transform;
  z-index: 1;
  filter: drop-shadow(0 10px 40px rgba(0,0,0,0.5));
}

#wheel-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.wheel-pointer {
  position: absolute;
  top: -8px;
  left: 50%;
  margin-left: -19px;
  width: 38px;
  height: 54px;
  z-index: 10;
  filter: drop-shadow(0 4px 12px rgba(255, 196, 0, 0.7));
  transform-origin: 50% 8%;
  pointer-events: none;
}

.wheel-pointer svg {
  width: 100%;
  height: 100%;
  display: block;
}

@keyframes pointer-tick {
  0% { transform: rotate(0deg); }
  35% { transform: rotate(-15deg); }
  100% { transform: rotate(0deg); }
}

.wheel-hub {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 24%;
  height: 24%;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--bg-3), var(--bg) 70%);
  border: 3px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  box-shadow:
    0 0 0 4px var(--bg),
    0 0 30px var(--glow),
    inset 0 0 20px rgba(255, 46, 126, 0.3),
    inset 0 0 0 2px rgba(255,255,255,0.05);
  animation: pulse-hub 2.5s infinite ease-in-out;
}

@keyframes pulse-hub {
  0%, 100% {
    box-shadow:
      0 0 0 4px var(--bg),
      0 0 30px var(--glow),
      inset 0 0 20px rgba(255, 46, 126, 0.3),
      inset 0 0 0 2px rgba(255,255,255,0.05);
  }
  50% {
    box-shadow:
      0 0 0 4px var(--bg),
      0 0 60px var(--glow),
      inset 0 0 30px rgba(255, 46, 126, 0.6),
      inset 0 0 0 2px rgba(255,255,255,0.1);
  }
}

.wheel-container.spinning .wheel-hub {
  animation: pulse-hub-fast 0.4s infinite ease-in-out;
}

@keyframes pulse-hub-fast {
  0%, 100% {
    box-shadow:
      0 0 0 4px var(--bg),
      0 0 40px var(--glow),
      inset 0 0 20px rgba(255, 46, 126, 0.5);
  }
  50% {
    box-shadow:
      0 0 0 4px var(--bg),
      0 0 90px var(--glow),
      inset 0 0 45px rgba(255, 46, 126, 0.9);
  }
}

.spin-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  border: none;
  width: 82%;
  height: 82%;
  border-radius: 50%;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(0.9rem, 3.5vw, 1.5rem);
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(255, 46, 126, 0.4);
}

.spin-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent-3), var(--accent-4));
  opacity: 0;
  transition: opacity 0.3s;
  border-radius: 50%;
}

.spin-btn span {
  position: relative;
  z-index: 1;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}

.spin-btn:hover:not(:disabled) {
  transform: scale(1.08);
  box-shadow: 0 0 35px var(--accent), 0 4px 15px rgba(255, 46, 126, 0.6);
}

.spin-btn:hover:not(:disabled)::before { opacity: 1; }

.spin-btn:active:not(:disabled) { transform: scale(0.95); }

.spin-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  filter: grayscale(0.3);
}

/* Segments */
.segment {
  transition: filter 0.3s;
}

.segment-number {
  fill: white;
  stroke: rgba(0, 0, 0, 0.6);
  stroke-width: 3;
  stroke-linejoin: round;
  paint-order: stroke fill;
  font-family: 'Bebas Neue', sans-serif;
  user-select: none;
  pointer-events: none;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
}

/* Winner popup */
.winner-popup {
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 10, 0.88);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s;
  overflow: hidden;
}

.winner-popup.active {
  opacity: 1;
  pointer-events: all;
}

.popup-rays {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 200vmax;
  height: 200vmax;
  transform: translate(-50%, -50%);
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    rgba(255, 196, 0, 0.12) 4deg,
    transparent 8deg,
    transparent 25deg,
    rgba(255, 46, 126, 0.12) 29deg,
    transparent 33deg,
    transparent 55deg,
    rgba(0, 217, 163, 0.1) 59deg,
    transparent 63deg
  );
  z-index: 0;
  opacity: 0;
  animation: rays-rotate 25s linear infinite;
}

.winner-popup.active .popup-rays {
  animation: rays-rotate 25s linear infinite, fade-in-rays 0.8s 0.3s forwards;
}

@keyframes rays-rotate {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

@keyframes fade-in-rays {
  to { opacity: 1; }
}

.popup-content {
  text-align: center;
  position: relative;
  z-index: 2;
  padding: 2rem;
}

.popup-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 14px;
  color: var(--accent-3);
  margin-bottom: 1rem;
  text-shadow: 0 0 25px var(--accent-3);
  opacity: 0;
  animation: fade-up 0.6s 0.2s forwards;
}

.popup-number-wrap {
  position: relative;
  display: inline-block;
  padding: 1rem 3rem;
}

.popup-number-wrap::before,
.popup-number-wrap::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent));
  transform: translateY(-50%);
  opacity: 0;
  animation: line-in 0.6s 0.8s forwards;
}

.popup-number-wrap::before { left: -20px; }
.popup-number-wrap::after {
  right: -20px;
  background: linear-gradient(90deg, var(--accent), transparent);
}

@keyframes line-in {
  to { opacity: 1; }
}

.popup-number {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(7rem, 22vw, 15rem);
  font-weight: 900;
  line-height: 1;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 40%, var(--accent-3) 80%, var(--accent-4) 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 40px var(--glow));
  display: inline-block;
  opacity: 0;
  transform: scale(0) rotate(-180deg);
  animation: number-reveal 1s 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
             gradient-shift 3s 1.5s ease-in-out infinite;
}

@keyframes number-reveal {
  0% { opacity: 0; transform: scale(0) rotate(-180deg); }
  60% { opacity: 1; transform: scale(1.2) rotate(10deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes gradient-shift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.popup-subtitle {
  font-size: 0.85rem;
  color: var(--muted);
  letter-spacing: 6px;
  text-transform: uppercase;
  margin-top: 1.5rem;
  opacity: 0;
  animation: fade-up 0.6s 0.9s forwards;
}

.popup-countdown {
  width: min(280px, 60vw);
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
  margin: 2rem auto 0;
  opacity: 0;
  animation: fade-up 0.4s 1.1s forwards;
}

.popup-countdown-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-3), var(--accent));
  width: 100%;
  transform-origin: left;
  box-shadow: 0 0 10px var(--accent);
}

.winner-popup.active .popup-countdown-bar {
  animation: countdown 4s 1s linear forwards;
}

@keyframes countdown {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}

/* Game over */
.game-over {
  position: fixed;
  inset: 0;
  background: rgba(5,5,10,0.92);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s;
}

.game-over.active {
  opacity: 1;
  pointer-events: all;
}

.game-over-content {
  text-align: center;
  padding: 2rem;
  max-width: 500px;
}

.game-over h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2rem, 6vw, 3.5rem);
  letter-spacing: 8px;
  background: linear-gradient(135deg, var(--accent-3), var(--accent-4));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 1rem;
  filter: drop-shadow(0 0 20px var(--accent-4));
}

.game-over p {
  color: var(--muted);
  margin-bottom: 2rem;
  letter-spacing: 1px;
  line-height: 1.6;
}

.reset-btn {
  background: linear-gradient(135deg, var(--accent-4), var(--accent-3));
  color: var(--bg);
  border: none;
  padding: 1.1rem 2.8rem;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 5px;
  border-radius: 60px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-weight: 700;
  box-shadow: 0 4px 20px rgba(0, 217, 163, 0.3);
}

.reset-btn:hover {
  transform: scale(1.05) translateY(-3px);
  box-shadow: 0 10px 35px rgba(0, 217, 163, 0.5);
}

.reset-btn:active {
  transform: scale(0.98);
}

/* Responsive */
@media (max-width: 1100px) {
  main { grid-template-columns: 1fr; }
  .side-panel { order: 2; }
  .wheel-section { order: 1; }
  .left-panel { order: 3; }
  .right-panel { order: 4; }
}

@media (max-width: 700px) {
  .numbers-grid { grid-template-columns: repeat(8, 1fr); }
  .title { letter-spacing: 5px; }
  .stats-bar { flex-wrap: wrap; justify-content: center; }
}

@media (max-width: 420px) {
  .numbers-grid { grid-template-columns: repeat(4, 1fr); }
  .popup-label { letter-spacing: 8px; font-size: 1.1rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<main>
  <aside class="side-panel left-panel">
    <div class="panel-title">Numbers Pool</div>
    <div class="numbers-grid" id="numbers-grid"></div>
  </aside>

  <section class="wheel-section">
    <h1 class="title">SPIN THE WHEEL</h1>
    <p class="subtitle">16 Numbers · Equal Chance · One Winner</p>

    <div class="stats-bar">
      <div class="stat-pill" id="spins-pill">
        <span class="stat-label">Spins</span>
        <span class="stat-value" id="spin-count">0</span>
      </div>
      <div class="stat-pill" id="remaining-pill">
        <span class="stat-label">Remaining</span>
        <span class="stat-value" id="remaining-count">16</span>
      </div>
    </div>

    <div class="wheel-container" id="wheel-container">
      <div class="wheel-glow"></div>
      <div class="wheel-pointer" id="wheel-pointer">
        <svg viewBox="0 0 38 54">
          <defs>
            <linearGradient id="ptr-grad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffc400"/>
              <stop offset="100%" stop-color="#ff7b00"/>
            </linearGradient>
          </defs>
          <path d="M 19 54 L 1 8 Q 0 0 8 0 L 30 0 Q 38 0 37 8 Z" fill="url(#ptr-grad)" stroke="#fff" stroke-width="1.5"/>
          <circle cx="19" cy="10" r="3.5" fill="#fff"/>
          <circle cx="19" cy="10" r="1.5" fill="#ff2e7e"/>
        </svg>
      </div>
      <svg class="wheel-ring" viewBox="0 0 500 500">
        <circle cx="250" cy="250" r="246" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
        <circle cx="250" cy="250" r="238" fill="none" stroke="rgba(255,46,126,0.25)" stroke-width="1" stroke-dasharray="3 5"/>
        <g id="ticks"></g>
        <circle cx="250" cy="250" r="232" fill="none" stroke="rgba(255,196,0,0.3)" stroke-width="1"/>
      </svg>
      <div class="wheel" id="wheel">
        <svg id="wheel-svg" viewBox="0 0 500 500"></svg>
      </div>
      <div class="wheel-hub">
        <button id="spin-btn" class="spin-btn" aria-label="Spin the wheel"><span>SPIN</span></button>
      </div>
    </div>
  </section>

  <aside class="side-panel right-panel">
    <div class="panel-title">History</div>
    <div class="history-list" id="history-list">
      <div class="history-empty">No spins yet</div>
    </div>
  </aside>
</main>

<div class="winner-popup" id="winner-popup" role="dialog" aria-modal="true">
  <div class="popup-rays"></div>
  <div class="popup-content">
    <div class="popup-label">WINNER</div>
    <div class="popup-number-wrap">
      <div class="popup-number" id="winner-number">0</div>
    </div>
    <div class="popup-subtitle">Number Drawn</div>
    <div class="popup-countdown">
      <div class="popup-countdown-bar"></div>
    </div>
  </div>
</div>

<div class="game-over" id="game-over" role="dialog" aria-modal="true">
  <div class="game-over-content">
    <h2>ALL DRAWN</h2>
    <p>Every number has been selected. The wheel is empty — reset to play again.</p>
    <button class="reset-btn" id="reset-btn">PLAY AGAIN</button>
  </div>
</div>

<script>
/* ============ Configuration ============ */
const SEGMENT_COLORS = ['#ff2e7e', '#ff7b00', '#ffc400', '#00d9a3'];
const TOTAL_NUMBERS = 16;
const SPIN_DURATION = 10000;
const POPUP_DURATION = 5000;
const MIN_TICK_INTERVAL = 55; // ms between pointer ticks

/* ============ State ============ */
let remainingNumbers = Array.from({length: TOTAL_NUMBERS}, (_, i) => i + 1);
let history = [];
let currentRotation = 0;
let isSpinning = false;
let spinCount = 0;
let tickRAF = null;
let lastSegmentAtTop = -1;
let lastTickTime = 0;

/* ============ DOM ============ */
const wheelSvg = document.getElementById('wheel-svg');
const wheelEl = document.getElementById('wheel');
const wheelContainer = document.getElementById('wheel-container');
const wheelPointer = document.getElementById('wheel-pointer');
const spinBtn = document.getElementById('spin-btn');
const winnerPopup = document.getElementById('winner-popup');
const winnerNumberEl = document.getElementById('winner-number');
const gameOverEl = document.getElementById('game-over');
const numbersGrid = document.getElementById('numbers-grid');
const historyList = document.getElementById('history-list');
const spinCountEl = document.getElementById('spin-count');
const remainingCountEl = document.getElementById('remaining-count');
const spinsPill = document.getElementById('spins-pill');
const remainingPill = document.getElementById('remaining-pill');

/* ============ Background Canvas ============ */
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let bgParticles = [];

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  initBgParticles();
}

function initBgParticles() {
  bgParticles = [];
  const count = Math.min(80, Math.floor((bgCanvas.width * bgCanvas.height) / 18000));
  for (let i = 0; i < count; i++) {
    bgParticles.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      size: Math.random() * 2.2 + 0.6,
      isNumber: Math.random() > 0.65,
      number: Math.floor(Math.random() * TOTAL_NUMBERS) + 1,
      opacity: Math.random() * 0.25 + 0.05,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 0.3,
      color: SEGMENT_COLORS[Math.floor(Math.random() * SEGMENT_COLORS.length)]
    });
  }
}

function animateBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

  bgParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.rotationSpeed;

    if (p.x < -30) p.x = bgCanvas.width + 30;
    if (p.x > bgCanvas.width + 30) p.x = -30;
    if (p.y < -30) p.y = bgCanvas.height + 30;
    if (p.y > bgCanvas.height + 30) p.y = -30;

    bgCtx.save();
    bgCtx.globalAlpha = p.opacity;

    if (p.isNumber) {
      bgCtx.translate(p.x, p.y);
      bgCtx.rotate(p.rotation * Math.PI / 180);
      bgCtx.fillStyle = p.color;
      bgCtx.font = 'bold 18px "Bebas Neue", sans-serif';
      bgCtx.textAlign = 'center';
      bgCtx.textBaseline = 'middle';
      bgCtx.fillText(p.number, 0, 0);
    } else {
      bgCtx.fillStyle = p.color;
      bgCtx.shadowBlur = 12;
      bgCtx.shadowColor = p.color;
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      bgCtx.fill();
    }

    bgCtx.restore();
  });

  requestAnimationFrame(animateBg);
}

resizeBg();
window.addEventListener('resize', resizeBg);
animateBg();

/* ============ Confetti ============ */
const confettiCanvas = document.getElementById('confetti-canvas');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiParticles = [];
let confettiAnimating = false;

function resizeConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
resizeConfetti();
window.addEventListener('resize', resizeConfetti);

function launchConfetti() {
  const colors = [...SEGMENT_COLORS, '#ffffff'];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  for (let i = 0; i < 180; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 16 + 6;
    confettiParticles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 6,
      size: Math.random() * 9 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 28,
      life: 1,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }

  setTimeout(() => {
    for (let i = 0; i < 80; i++) {
      confettiParticles.push({
        x: Math.random() * window.innerWidth,
        y: -20,
        vx: (Math.random() - 0.5) * 4,
        vy: Math.random() * 3 + 2,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 20,
        life: 1,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }
  }, 300);

  if (!confettiAnimating) {
    confettiAnimating = true;
    animateConfetti();
  }
}

function animateConfetti() {
  confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

  confettiParticles = confettiParticles.filter(p => p.life > 0 && p.y < confettiCanvas.height + 50);

  confettiParticles.forEach(p => {
    p.vy += 0.35;
    p.vx *= 0.995;
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.rotationSpeed;
    p.life -= 0.005;

    confettiCtx.save();
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate(p.rotation * Math.PI / 180);
    confettiCtx.globalAlpha = Math.max(0, p.life);
    confettiCtx.fillStyle = p.color;
    confettiCtx.shadowBlur = 6;
    confettiCtx.shadowColor = p.color;

    if (p.shape === 'rect') {
      confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else {
      confettiCtx.beginPath();
      confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      confettiCtx.fill();
    }

    confettiCtx.restore();
  });

  if (confettiParticles.length > 0) {
    requestAnimationFrame(animateConfetti);
  } else {
    confettiAnimating = false;
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }
}

/* ============ Wheel Drawing ============ */
function drawWheel() {
  wheelSvg.innerHTML = '';

  const n = remainingNumbers.length;
  if (n === 0) return;

  const segmentAngle = 360 / n;
  const radius = 240;
  const cx = 250, cy = 250;

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  remainingNumbers.forEach((num, i) => {
    const color = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
    const grad = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
    grad.setAttribute('id', `seg-grad-${i}`);
    grad.setAttribute('cx', '50%');
    grad.setAttribute('cy', '50%');
    grad.setAttribute('r', '70%');

    const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    stop1.setAttribute('offset', '0%');
    stop1.setAttribute('stop-color', color);
    stop1.setAttribute('stop-opacity', '0.65');

    const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    stop2.setAttribute('offset', '70%');
    stop2.setAttribute('stop-color', color);
    stop2.setAttribute('stop-opacity', '1');

    const stop3 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    stop3.setAttribute('offset', '100%');
    stop3.setAttribute('stop-color', color);
    stop3.setAttribute('stop-opacity', '0.85');

    grad.appendChild(stop1);
    grad.appendChild(stop2);
    grad.appendChild(stop3);
    defs.appendChild(grad);
  });
  wheelSvg.appendChild(defs);

  if (n === 1) {
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', cx);
    circle.setAttribute('cy', cy);
    circle.setAttribute('r', radius);
    circle.setAttribute('fill', `url(#seg-grad-0)`);
    circle.setAttribute('stroke', 'rgba(0,0,0,0.4)');
    circle.setAttribute('stroke-width', '2');
    circle.classList.add('segment');
    circle.setAttribute('data-number', remainingNumbers[0]);
    wheelSvg.appendChild(circle);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', cx);
    text.setAttribute('y', cy - radius * 0.65);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('font-size', '52');
    text.setAttribute('font-weight', '900');
    text.classList.add('segment-number');
    text.textContent = remainingNumbers[0];
    wheelSvg.appendChild(text);
    return;
  }

  remainingNumbers.forEach((num, i) => {
    const startAngle = i * segmentAngle;
    const endAngle = (i + 1) * segmentAngle;

    const startRad = startAngle * Math.PI / 180;
    const endRad = endAngle * Math.PI / 180;

    const x1 = cx + radius * Math.sin(startRad);
    const y1 = cy - radius * Math.cos(startRad);
    const x2 = cx + radius * Math.sin(endRad);
    const y2 = cy - radius * Math.cos(endRad);

    const largeArc = segmentAngle > 180 ? 1 : 0;

    const path = `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;

    const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pathEl.setAttribute('d', path);
    pathEl.setAttribute('fill', `url(#seg-grad-${i})`);
    pathEl.setAttribute('stroke', 'rgba(0,0,0,0.45)');
    pathEl.setAttribute('stroke-width', '2');
    pathEl.setAttribute('stroke-linejoin', 'round');
    pathEl.classList.add('segment');
    pathEl.setAttribute('data-number', num);
    wheelSvg.appendChild(pathEl);

    const textAngle = startAngle + segmentAngle / 2;
    const textRad = textAngle * Math.PI / 180;
    const textR = radius * 0.72;
    const tx = cx + textR * Math.sin(textRad);
    const ty = cy - textR * Math.cos(textRad);

    const fontSize = n <= 4 ? '52' : n <= 8 ? '42' : n <= 12 ? '34' : '28';

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', tx);
    text.setAttribute('y', ty);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('font-size', fontSize);
    text.setAttribute('font-weight', '900');
    text.setAttribute('transform', `rotate(${textAngle} ${tx} ${ty})`);
    text.classList.add('segment-number');
    text.textContent = num;
    wheelSvg.appendChild(text);
  });

  const outerCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  outerCircle.setAttribute('cx', cx);
  outerCircle.setAttribute('cy', cy);
  outerCircle.setAttribute('r', radius);
  outerCircle.setAttribute('fill', 'none');
  outerCircle.setAttribute('stroke', 'rgba(255,255,255,0.18)');
  outerCircle.setAttribute('stroke-width', '3');
  wheelSvg.appendChild(outerCircle);

  const innerCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  innerCircle.setAttribute('cx', cx);
  innerCircle.setAttribute('cy', cy);
  innerCircle.setAttribute('r', 60);
  innerCircle.setAttribute('fill', 'rgba(10,10,18,0.4)');
  innerCircle.setAttribute('stroke', 'rgba(255,255,255,0.1)');
  innerCircle.setAttribute('stroke-width', '1');
  wheelSvg.appendChild(innerCircle);

  attachSegmentHover();
}

function drawTicks() {
  const ticksGroup = document.getElementById('ticks');
  ticksGroup.innerHTML = '';
  const cx = 250, cy = 250;
  const r1 = 246, r2major = 226, r2minor = 234;

  for (let i = 0; i < 72; i++) {
    const angle = i * 5;
    const rad = angle * Math.PI / 180;
    const isMajor = i % 6 === 0;
    const r2 = isMajor ? r2major : r2minor;

    const x1 = cx + r1 * Math.sin(rad);
    const y1 = cy - r1 * Math.cos(rad);
    const x2 = cx + r2 * Math.sin(rad);
    const y2 = cy - r2 * Math.cos(rad);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', isMajor ? 'rgba(255, 196, 0, 0.7)' : 'rgba(255,255,255,0.2)');
    line.setAttribute('stroke-width', isMajor ? '2' : '1');
    line.setAttribute('stroke-linecap', 'round');
    ticksGroup.appendChild(line);
  }
}

/* ============ Hover Interaction ============ */
function attachSegmentHover() {
  document.querySelectorAll('.number-cell.active').forEach(cell => {
    cell.addEventListener('mouseenter', () => {
      const num = parseInt(cell.textContent);
      const segment = document.querySelector(`.segment[data-number="${num}"]`);
      if (segment) {
        segment.style.filter = 'brightness(1.5) drop-shadow(0 0 20px white)';
      }
    });
    cell.addEventListener('mouseleave', () => {
      const num = parseInt(cell.textContent);
      const segment = document.querySelector(`.segment[data-number="${num}"]`);
      if (segment) {
        segment.style.filter = '';
      }
    });
  });
}

/* ============ Pointer Tick Tracking ============ */
function getComputedRotation(el) {
  const transform = window.getComputedStyle(el).transform;
  if (transform === 'none' || !transform) return 0;
  const match = transform.match(/matrix\(([^)]+)\)/);
  if (!match) return 0;
  const values = match[1].split(',').map(parseFloat);
  let angle = Math.atan2(values[1], values[0]) * 180 / Math.PI;
  if (angle < 0) angle += 360;
  return angle;
}

function startPointerTracking() {
  const n = remainingNumbers.length;
  if (n <= 1) return;

  const segmentAngle = 360 / n;
  lastSegmentAtTop = -1;
  lastTickTime = 0;

  function check() {
    if (!isSpinning) return;

    const rotation = getComputedRotation(wheelEl);
    const segmentAtTop = Math.floor(((360 - rotation) % 360) / segmentAngle) % n;

    if (segmentAtTop !== lastSegmentAtTop) {
      lastSegmentAtTop = segmentAtTop;
      triggerPointerTick();
    }

    tickRAF = requestAnimationFrame(check);
  }

  tickRAF = requestAnimationFrame(check);
}

function stopPointerTracking() {
  if (tickRAF) {
    cancelAnimationFrame(tickRAF);
    tickRAF = null;
  }
  wheelPointer.style.animation = '';
}

function triggerPointerTick() {
  const now = performance.now();
  if (now - lastTickTime < MIN_TICK_INTERVAL) return;
  lastTickTime = now;

  wheelPointer.style.animation = 'none';
  void wheelPointer.offsetWidth;
  wheelPointer.style.animation = 'pointer-tick 140ms ease-out';
}

/* ============ Spin Logic ============ */
function spin() {
  if (isSpinning || remainingNumbers.length === 0) return;

  isSpinning = true;
  spinCount++;
  spinCountEl.textContent = spinCount;
  spinsPill.classList.remove('flash');
  void spinsPill.offsetWidth;
  spinsPill.classList.add('flash');

  spinBtn.disabled = true;

  const n = remainingNumbers.length;
  const segmentAngle = 360 / n;

  const winnerIndex = Math.floor(Math.random() * n);
  const winner = remainingNumbers[winnerIndex];

  const targetSegmentMiddle = winnerIndex * segmentAngle + segmentAngle / 2;
  const currentMod = ((currentRotation % 360) + 360) % 360;
  const targetMod = ((-targetSegmentMiddle) % 360 + 360) % 360;

  let delta = targetMod - currentMod;
  if (delta <= 0) delta += 360;

  const fullRotations = 6 * 360;
  const finalRotation = currentRotation + fullRotations + delta;

  currentRotation = finalRotation;

  wheelEl.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.17, 0.67, 0.12, 0.99)`;
  wheelEl.style.transform = `rotate(${finalRotation}deg)`;

  wheelContainer.classList.add('spinning');
  startPointerTracking();

  setTimeout(() => {
    wheelContainer.classList.remove('spinning');
    stopPointerTracking();
    showWinner(winner);
  }, SPIN_DURATION);
}

/* ============ Winner Display ============ */
function showWinner(winner) {
  winnerNumberEl.textContent = winner;

  winnerNumberEl.style.animation = 'none';
  void winnerNumberEl.offsetWidth;
  winnerNumberEl.style.animation = '';

  winnerPopup.classList.add('active');

  setTimeout(launchConfetti, 400);

  history.unshift({ number: winner, time: new Date() });
  updateHistory();

  document.querySelectorAll('.number-cell').forEach(cell => {
    if (parseInt(cell.textContent) === winner) {
      cell.classList.add('just-drawn');
      setTimeout(() => {
        cell.classList.remove('active');
        cell.classList.add('drawn');
      }, 700);
    }
  });

  setTimeout(() => {
    winnerPopup.classList.remove('active');

    setTimeout(() => {
      remainingNumbers = remainingNumbers.filter(n => n !== winner);
      remainingCountEl.textContent = remainingNumbers.length;
      remainingPill.classList.remove('flash');
      void remainingPill.offsetWidth;
      remainingPill.classList.add('flash');

      wheelEl.style.transition = 'none';
      wheelEl.style.transform = `rotate(${currentRotation}deg)`;
      drawWheel();

      if (remainingNumbers.length === 0) {
        gameOverEl.classList.add('active');
        spinBtn.disabled = true;
      } else {
        spinBtn.disabled = false;
      }

      isSpinning = false;
    }, 600);
  }, POPUP_DURATION);
}

/* ============ UI Updates ============ */
function updateNumbersGrid() {
  numbersGrid.innerHTML = '';
  for (let i = 1; i <= TOTAL_NUMBERS; i++) {
    const cell = document.createElement('div');
    cell.className = 'number-cell';
    if (remainingNumbers.includes(i)) {
      cell.classList.add('active');
    } else {
      cell.classList.add('drawn');
    }
    cell.textContent = i;
    numbersGrid.appendChild(cell);
  }
  attachSegmentHover();
}

function updateHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<div class="history-empty">No spins yet</div>';
    return;
  }
  historyList.innerHTML = '';
  history.slice(0, 20).forEach((h, i) => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.style.animationDelay = `${i * 0.04}s`;
    const timeStr = h.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    item.innerHTML = `
      <span class="history-number">#${h.number}</span>
      <span class="history-time">${timeStr}</span>
    `;
    historyList.appendChild(item);
  });
}

/* ============ Reset ============ */
function reset() {
  remainingNumbers = Array.from({length: TOTAL_NUMBERS}, (_, i) => i + 1);
  history = [];
  currentRotation = 0;
  isSpinning = false;
  spinCount = 0;

  spinCountEl.textContent = '0';
  remainingCountEl.textContent = TOTAL_NUMBERS;
  gameOverEl.classList.remove('active');
  winnerPopup.classList.remove('active');

  wheelEl.style.transition = 'none';
  wheelEl.style.transform = 'rotate(0deg)';

  drawWheel();
  updateNumbersGrid();
  updateHistory();

  spinBtn.disabled = false;
}

/* ============ Mouse Parallax ============ */
let parallaxX = 0, parallaxY = 0;
document.addEventListener('mousemove', (e) => {
  parallaxX = (e.clientX / window.innerWidth - 0.5) * 25;
  parallaxY = (e.clientY / window.innerHeight - 0.5) * 25;
  const glow = document.querySelector('.wheel-glow');
  if (glow && !wheelContainer.classList.contains('spinning')) {
    glow.style.transform = `translate(${parallaxX}px, ${parallaxY}px)`;
  }
});

/* ============ Initialization ============ */
drawWheel();
drawTicks();
updateNumbersGrid();
updateHistory();

spinBtn.addEventListener('click', spin);
document.getElementById('reset-btn').addEventListener('click', reset);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !isSpinning && remainingNumbers.length > 0 && !winnerPopup.classList.contains('active') && !gameOverEl.classList.contains('active')) {
    e.preventDefault();
    spin();
  }
  if (e.code === 'KeyR' && gameOverEl.classList.contains('active')) {
    e.preventDefault();
    reset();
  }
});
